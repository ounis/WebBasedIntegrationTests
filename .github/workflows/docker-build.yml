name: Docker build

# This repo is a PHP/Apache web app driven by Selenium integration tests, not a
# Composer/Laravel project. Until the Selenium suite runs in CI, this verifies
# that the Docker image builds -- the meaningful, always-runnable signal here.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
